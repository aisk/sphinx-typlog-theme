name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"
            sphinx: ">=5,<6"
          - python: "3.10"
            sphinx: ">=6,<7"
          - python: "3.11"
            sphinx: ">=7,<8"
          - python: "3.12"
            sphinx: ">=8,<9"
          - python: "3.13"
            sphinx: ">=9,<10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "sphinx${{ matrix.sphinx }}" .
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
